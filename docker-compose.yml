services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: media_optimizer_app
    ports:
      - "80:80"
    volumes:
      - .:/var/www/html
    depends_on:
      - db

  db:
    image: mysql:8.0
    container_name: media_optimizer_db
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: secret
      MYSQL_DATABASE: media_optimizer
    volumes:
      - dbdata:/var/lib/mysql

volumes:
  dbdata: